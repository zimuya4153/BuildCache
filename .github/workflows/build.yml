name: Build SDK

on:
  # Automatic (scheduled) runs are off on purpose: a round is expensive and is
  # started by hand. Put the cron trigger back when the cache should refill
  # itself again:
  #   schedule:
  #     - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      plugin:
        description: only build this plugin
        default: ""
      version:
        description: only build this exact SDK version
        default: ""
      batch:
        description: versions per plugin, newest first
        default: "3"
      first_only:
        description: only the newest version
        type: boolean
        default: false
      rebuild_all:
        description: ignore what is already published
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Discover
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          python scripts/discover.py `
            --plugin "${{ inputs.plugin }}" `
            --version "${{ inputs.version }}" `
            --batch "${{ inputs.batch }}" `
            --report-skipped

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    # The era of the version decides the image: ancient tags need an MSVC of
    # their own generation (see plugins/ll/plugin.py::toolchain_plan).
    runs-on: ${{ matrix.image || 'windows-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Newer LeviLamina tags want clang-cl of the same generation; the
      # image's own LLVM is older than that.
      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22
      # An old era's sources only compile with the MSVC of their own generation
      # (LeviLamina 0.13.5 pulls in a libhat that dies on the newest one), and the
      # hosted image ships just that newest one. Install the era's toolset and use
      # it for the build.
      - name: Install the era's MSVC
        id: msvc
        if: matrix.msvc_component != ''
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          # Do not guess component ids: the installer answers 87 (invalid
          # parameter) for one that is not in this Visual Studio's catalog. Ask
          # the channel manifest which toolset components this VS can install.
          $available = @()
          $manifest = Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages\_Channels" `
              -Recurse -Filter channelManifest.json -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($manifest) {
            Write-Output "catalog: $($manifest.FullName)"
            $available = (Get-Content $manifest.FullName -Raw | ConvertFrom-Json).channelItems |
              Where-Object { $_.id -like "*VC.${{ matrix.msvc_version }}.*x86.x64*" } |
              Select-Object -ExpandProperty id -Unique
          }
          Write-Output "components for ${{ matrix.msvc_version }}: $($available -join ', ')"
          # The era's own generation first; older ones as a fallback, because an
          # era's sources only compile with a compiler of about their age.
          $candidates = @($available) + @("${{ matrix.msvc_component }}")
          foreach ($component in $candidates) {
            if (-not $component) { continue }
            Write-Output "== installing $component"
            # The bootstrapper is a GUI binary and does not report a meaningful
            # exit code, so launch it and wait for the toolset to appear instead.
            Start-Process -FilePath $installer -ArgumentList @(
              'modify',
              '--installPath', $vs,
              '--productId', 'Microsoft.VisualStudio.Product.Enterprise',
              '--channelId', 'VisualStudio.17.Release',
              '--add', $component,
              '--quiet', '--norestart'
            ) | Out-Null
            $found = $null
            for ($i = 0; $i -lt 30 -and -not $found; $i++) {
              Start-Sleep -Seconds 10
              $found = Get-ChildItem "$vs\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like "${{ matrix.msvc_version }}.*" } |
                Sort-Object Name -Descending | Select-Object -First 1
            }
            if ($found -and $found.Name -notlike "14.51.*" -and $found.Name -notlike "14.44.*") {
              Write-Output "using $($found.Name)"
              "vs_toolset=$($found.Name)" >> $env:GITHUB_OUTPUT
              return
            }
            # Say why, instead of only that it did not work.
            Get-ChildItem "$vs\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "   present: $($_.Name)" }
            $log = Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              Write-Output "   installer log: $($log.FullName)"
              Get-Content $log.FullName -Tail 20 | ForEach-Object { Write-Output "   | $_" }
            }
          }
          throw "no older MSVC toolset could be installed"
      # Which MSVC generations and platform toolsets this image has, so an era
      # failure can be read without guessing.
      - name: MSVC diagnostics
        if: always()
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          foreach ($path in @("$vs\VC\Tools\MSVC",
                              "$vs\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets")) {
            Write-Output "== $path"
            if (Test-Path $path) {
              Write-Output ("   " + ((Get-ChildItem $path | Select-Object -ExpandProperty Name) -join ", "))
            }
            else { Write-Output "  (missing)" }
          }
          Write-Output "== vswhere"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * -latest -property installationVersion
      - name: Build ${{ matrix.package }} ${{ matrix.version }}
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build.py --plugin "${{ matrix.plugin }}" `
            --version "${{ matrix.version }}" `
            --entry "${{ matrix.entry }}" `
            --commit "${{ matrix.commit }}" `
            ${{ (steps.msvc.outputs.vs_toolset || matrix.vs_toolset) && format('--vs-toolset={0}', steps.msvc.outputs.vs_toolset || matrix.vs_toolset) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-result-${{ matrix.plugin }}-${{ strategy.job-index }}
          path: results/build-result-*.json
          if-no-files-found: ignore

  finalize:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: windows-latest
    concurrency:
      group: buildcache-finalize
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: build-result-*
          merge-multiple: true
          path: results
      - name: Configure git
        run: |
          # The scripts also pass -c user.name/-c user.email from config.json;
          # this only covers git calls that are not wrapped by them.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update index and manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDCACHE_PUSH_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
        run: python scripts/finalize.py --push

